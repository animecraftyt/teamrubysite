<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RubyOS Dev Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: #000;
            color: #00ff00;
            font-family: "Courier New", monospace;
            margin: 0;
            padding: 20px;

            /* CRT EFFECT */
            position: relative;
            overflow: hidden;
        }

        /* CRT Scanlines */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.03) 0px,
                rgba(255,255,255,0.03) 2px,
                rgba(0,0,0,0.05) 2px,
                rgba(0,0,0,0.05) 4px
            );
            z-index: 9998;
        }

        /* CRT Glow */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
            z-index: 9997;
        }

        #console {
            max-width: 900px;
            margin: 0 auto;
            white-space: pre-wrap;
            font-size: 16px;
            position: relative;
            z-index: 1;
        }

        .line {
            margin: 2px 0;
        }

        #input-line {
            display: none;
            margin-top: 10px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        #prompt {
            display: inline-block;
            margin-right: 8px;
        }

        #command-input {
            width: calc(100% - 120px);
            background: #000;
            color: #00ff00;
            border: none;
            outline: none;
            font-family: "Courier New", monospace;
            font-size: 16px;
        }

        #back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 14px;
            border: 1px solid #00ff00;
            color: #00ff00;
            text-decoration: none;
            font-family: "Courier New", monospace;
            position: relative;
            z-index: 1;
        }

        #back-btn:hover {
            background: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>

<div id="console"></div>

<a id="back-btn" href="../index.html">← Back to Website</a>

<div id="input-line">
    <span id="prompt">ruby@RubyOS:~$</span>
    <input id="command-input" type="text" autocomplete="off">
</div>

<!-- FULLSCREEN LIGHTBOX -->
<div id="lightbox" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
">
    <button id="lightbox-close" style="
        position: absolute;
        top: 20px;
        right: 25px;
        font-size: 40px;
        color: white;
        background: none;
        border: none;
        cursor: pointer;
    ">×</button>

    <img id="lightbox-image" src="" style="
        max-width: 100%;
        max-height: 90vh;
        border: 3px solid #fff;
        border-radius: 10px;
        background: #000;
    ">
</div>

<script>
const consoleEl = document.getElementById("console");
const inputEl = document.getElementById("command-input");
const inputLine = document.getElementById("input-line");

let bootStage = 0;
let awaitingUnstableConfirm = false;

function printLine(text = "") {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = text;
    consoleEl.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
}

/* ============================
   RUBYOS PIXEL ART LOGO (BIG + TOP)
   ============================ */
const rubyLogo = document.createElement("img");
rubyLogo.src = "../assets/pictures/gallery/console/rubyos.png";

/* MAKE IT BIGGER */
rubyLogo.style.maxWidth = "600px";   // ← adjust size here
rubyLogo.style.width = "100%";
rubyLogo.style.display = "block";
rubyLogo.style.margin = "0 auto 40px auto";
rubyLogo.style.cursor = "pointer";



/* Insert BEFORE boot text */
consoleEl.appendChild(rubyLogo);

function bootSequence() {
    printLine("RubyOS Bootloader v1.0");
    setTimeout(() => printLine("Initializing kernel..."), 600);
    setTimeout(() => printLine("Loading drivers..."), 1200);
    setTimeout(() => printLine("Starting system services..."), 1800);
    setTimeout(() => printLine("Boot complete."), 2400);
    setTimeout(() => loginSequence(), 3000);
}

function loginSequence() {
    printLine("");
    printLine("RubyOS Login Required");
    printLine("Enter username:");
    bootStage = 1;
    inputLine.style.display = "flex";
    inputEl.focus();
}

function showHelp() {
    printLine("Available commands:");
    printLine("  help");
    printLine("  demos");
    printLine("  clear");
    printLine("  unstable-info");
    printLine("  unstable-data-percentage");
    printLine("  unstable-gallery");
    printLine("");
}

function showDemos() {
    printLine("Available Web Demos:");
    printLine("  amy        - playable (no mobile controls)");
    printLine("  honk       - playable (mobile controls built-in)");
    printLine("  stickman   - playable (mobile controls built-in)");
    printLine("  chicken    - playable (controller support)");
    printLine("  unstable   - playable (no mobile controls)");
    printLine("");
}

function launchDemo(name) {
    let path = "";

    switch (name) {
        case "amy":
            printLine("Launching Amy’s Epic Adventure...");
            printLine("Note: No mobile controls.");
            path = "web-demos/amy-game/index.html";
            break;

        case "chicken":
            printLine("Launching Chicken Shooter 64...");
            printLine("Controller support detected.");
            path = "web-demos/chicken-game/index.html";
            break;

        case "honk":
            printLine("Launching Unexpected Honk...");
            printLine("Mobile controls enabled.");
            path = "web-demos/honk-game/index.html";
            break;

        case "stickman":
            printLine("Launching Stickman Adventure...");
            printLine("Mobile controls enabled.");
            path = "web-demos/stickman-game/index.html";
            break;

        case "unstable":
            return;

        default:
            printLine("Unknown demo: " + name);
            return;
    }

    window.location.href = path;
}

function handleUnstable() {
    awaitingUnstableConfirm = true;

    printLine("Before you continue, recovered lore was found inside the Sega Archives 1999 folder:");
    printLine("");
    printLine("In late 1999, Sega was experimenting with a 2D version of Sonic R for internal testing.");
    printLine("Most of the project files were corrupted, but Team Ruby recovered the test cartridge.");
    printLine("Only one playable character survived — Tails Doll.");
    printLine("");
    printLine("Play at your own curiosity.");
    printLine("");
    printLine("Do you want to continue? (yes/no)");
}

function unstableInfo() {
    printLine("Sega-1999 Test Cartridge [NOT FOR SALE]");
    printLine("Recovered internal Sega prototype starring Tails Doll.");
    printLine("");
    printLine("Game Jolt build:");
    printLine("https://gamejolt.com/games/sega-archives-1999/1108110");
    printLine("");
    printLine("Restored soundtrack:");
    printLine("https://drive.google.com/file/d/1bjQNazu_tJwhrs30llu75VVcKAhlnp5G/view");
    printLine("");
}

function showUnstablePercentage() {
    printLine("Analyzing recovered prototype data…");
    printLine("");
    printLine("Recovery status: 1% complete");
    printLine("");
}

/* ============================
   UNSTABLE GALLERY (FULLSCREEN)
   ============================ */
function showUnstableGallery() {
    printLine("Loading Sega Archives 1999 gallery...");
    printLine("");

    const galleryItems = [
        {
            src: "../assets/pictures/gallery/console/cartridge.png",
            caption: "The cartridge that was found in the Sega Archives 1999 folder."
        },
        {
            src: "../assets/pictures/gallery/console/title.png",
            caption: "Title screen."
        },
        {
            src: "../assets/pictures/gallery/console/chara_select.png",
            caption: "Select your character — just kidding, he's the only one playable."
        }
    ];

    galleryItems.forEach(item => {
        printLine(item.caption);

        const img = document.createElement("img");
        img.src = item.src;
        img.style.maxWidth = "300px";
        img.style.display = "block";
        img.style.margin = "10px 0";
        img.style.cursor = "pointer";

        img.addEventListener("click", () => {
            document.getElementById("lightbox-image").src = item.src;
            document.getElementById("lightbox").style.display = "flex";
        });

        consoleEl.appendChild(img);
        window.scrollTo(0, document.body.scrollHeight);
        printLine("");
    });

    printLine("Gallery loaded.");
}

/* ============================
   LIGHTBOX CLOSE LOGIC
   ============================ */
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");
const lightboxClose = document.getElementById("lightbox-close");

lightboxClose.addEventListener("click", () => {
    lightbox.style.display = "none";
    lightboxImage.src = "";
});

lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) {
        lightbox.style.display = "none";
        lightboxImage.src = "";
    }
});

/* ============================
   COMMAND HANDLER
   ============================ */
function handleCommand(cmdRaw) {
    const cmd = cmdRaw.trim().toLowerCase();

    if (awaitingUnstableConfirm) {
        if (cmd === "yes") {
            awaitingUnstableConfirm = false;
            printLine("Loading Sega Archives 1999 prototype...");
            window.location.href = "web-demos/unstable-game/index.html";
        } else if (cmd === "no") {
            awaitingUnstableConfirm = false;
            printLine("Prototype launch cancelled.");
        } else {
            printLine("Please type yes or no.");
        }
        return;
    }

    switch (cmd) {
        case "help":
            showHelp();
            break;
        case "demos":
            showDemos();
            break;
        case "clear":
            consoleEl.innerHTML = "";
            break;
        case "unstable-info":
            unstableInfo();
            break;
        case "unstable-data-percentage":
            showUnstablePercentage();
            break;
        case "unstable-gallery":
            showUnstableGallery();
            break;
        case "amy":
        case "honk":
        case "stickman":
        case "chicken":
            launchDemo(cmd);
            break;
        case "unstable":
            handleUnstable();
            break;
        default:
            printLine("Unknown command: " + cmd);
            break;
    }
}

inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const value = inputEl.value;

        if (bootStage === 1) {
            printLine("Username accepted.");
            printLine("Enter password:");
            bootStage = 2;
            inputEl.value = "";
            return;
        }

        if (bootStage === 2) {
            printLine("Password accepted.");
            printLine("");
            printLine("Welcome to RubyOS Dev Console.");
            printLine("Type help to begin.");
            bootStage = 3;
            inputEl.value = "";
            return;
        }

        printLine("ruby@RubyOS:~$ " + value);
        handleCommand(value);
        inputEl.value = "";
    }
});

document.body.addEventListener("touchstart", () => {
    inputEl.focus();
});

bootSequence();
</script>

</body>
</html>
